    <!-- manifest is injected dynamically by runtimePwaManifest.ts -->
    <script>
      (function() {
        try {
          var root = document.documentElement;
          var path = window.location.pathname || "";
          var host = (window.location.hostname || "").toLowerCase().replace(/^www\./, "");

          // ---------- STOREFRONT THEME (admin choice = absolute priority) ----------
          // Detect if this navigation targets a storefront (custom domain OR /loja/:slug).
          var isPlatformHost = /(^|\.)lovable\.app$/.test(host) ||
                               /(^|\.)lovableproject\.com$/.test(host) ||
                               host === "localhost" || host === "127.0.0.1";
          var slugMatch = path.match(/^\/loja\/([^\/]+)/);
          var storeSlug = slugMatch ? slugMatch[1].toLowerCase() : null;
          var isStorefront = !!storeSlug || (!isPlatformHost && host);

          if (isStorefront) {
            var storeKey = storeSlug
              ? ("store_theme_mode_slug_" + storeSlug)
              : ("store_theme_mode_host_" + host);
            var storeMode = localStorage.getItem(storeKey); // 'light' | 'dark' | 'system' | null
            var wantsDark = false;
            if (storeMode === "dark") wantsDark = true;
            else if (storeMode === "light") wantsDark = false;
            else if (storeMode === "system") {
              wantsDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            } else {
              // Unknown yet — start LIGHT to avoid a dark flash on light stores.
              wantsDark = false;
            }
            root.classList.toggle("dark", wantsDark);
          } else {
            // Admin / super-admin / platform pages keep their own toggle.
            var adminTheme = localStorage.getItem("theme_admin") ||
                             localStorage.getItem("theme_superadmin") || "light";
            if (adminTheme === "dark") root.classList.add("dark");
          }

          // ---------- Admin brand color (unchanged) ----------
          var adminPrimary = localStorage.getItem("admin_primary_color");
          if (adminPrimary) {
            var toHSL = function(hex) {
              var r = parseInt(hex.slice(1, 3), 16) / 255;
              var g = parseInt(hex.slice(3, 5), 16) / 255;
              var b = parseInt(hex.slice(5, 7), 16) / 255;
              var max = Math.max(r, g, b), min = Math.min(r, g, b);
              var h = 0, s = 0;
              var l = (max + min) / 2;
              if (max !== min) {
                var d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                  case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                  case g: h = ((b - r) / d + 2) / 6; break;
                  case b: h = ((r - g) / d + 4) / 6; break;
                }
              }
              return Math.round(h * 360) + " " + Math.round(s * 100) + "% " + Math.round(l * 100) + "%";
            };
            var hsl = toHSL(adminPrimary);
            root.style.setProperty("--primary", hsl);
            root.style.setProperty("--ring", hsl);
            root.style.setProperty("--sidebar-primary", hsl);
            root.style.setProperty("--sidebar-ring", hsl);
            root.style.setProperty("--accent-foreground", hsl);
          }
        } catch (e) {}
      })();
    </script>
